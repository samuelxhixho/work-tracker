<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>WorkTracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                    radial-gradient(
                            circle at top,
                            #172535 0%,
                            #0b1520 55%,
                            #071018 100%
                    );

            color: #f5ead7;

            font-family:
                    "Segoe UI",
                    sans-serif;

            user-select: none;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .title {
            margin: 0;

            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .status {
            margin: 0;

            color: #c9bda9;

            font-size: 14px;
        }

        .loader {
            width: 32px;
            height: 32px;

            margin-top: 8px;

            border: 3px solid rgba(245, 234, 215, 0.15);
            border-top-color: #d79a58;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<main class="splash">
    <h1 class="title">
        WorkTracker
    </h1>

    <p class="status">
        Warming up your workspace...
    </p>

    <div
            class="loader"
            aria-hidden="true"
    ></div>
</main>
</body>
</html>
